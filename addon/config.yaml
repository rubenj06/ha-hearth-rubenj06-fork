# Home Assistant add-on for this fork. The Supervisor finds it through
# repository.yaml at the repository root and builds addon/Dockerfile on the
# Home Assistant host; there is no prebuilt image.
name: Hearth (fork)
# <upstream Hearth version>.<fork release>; raising it offers an update that
# rebuilds from the fork's current master
version: 0.5.1.1
slug: hearth_fork
description: Hearth dashboard built from the rubenj06/ha-hearth-rubenj06-fork fork
arch:
  - aarch64
  - amd64

# disable the docker default system init
init: false

url: https://github.com/rubenj06/ha-hearth-rubenj06-fork

# icon for the menu panel integration
panel_icon: mdi:fireplace

# allow non-administration users
panel_admin: false

# security profile
apparmor: true

# ingress feature for the add-on
ingress: true
ingress_stream: true

# enable api to get host port
hassio_api: true

# port to expose, null defaults to disabled
ports:
  8099/tcp: null

# Browser-facing Home Assistant URL for direct-port access.
options: {}
schema:
  hass_public_url: url?
